<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Mạo từ Nâng cao</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Thử Thách Mạo Từ (a, an, the, Ø)</h1>
        <p class="text-slate-500 text-center mb-6 text-sm">Các câu hỏi bẫy cực khó dành cho bạn chinh phục!</p>

        <!-- Quiz Container -->
        <div id="quiz-container">
            <div class="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
                <span id="question-counter">Câu 1 / 8</span>
                <span id="score-tracker" class="hidden">Đúng: <span id="current-score">0</span>/8</span>
            </div>
            
            <div id="question-card" class="mb-6">
                <h2 id="question-text" class="text-lg font-semibold text-slate-800 mb-4"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl text-sm"></div>

            <button id="next-btn" onclick="nextQuestion()" class="w-full hidden bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md">
                Câu tiếp theo
            </button>
        </div>

        <!-- Result Container -->
        <div id="result-container" class="hidden text-center py-8">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Hoàn thành thử thách! 🎉</h2>
            <p id="final-score" class="text-xl text-indigo-600 font-semibold mb-6"></p>
            <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl transition duration-200 shadow-md">
                Làm lại từ đầu
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "It is universally agreed that ______ honesty is ______ best policy.",
                options: [
                    "the / the",
                    "Ø / the",
                    "the / a",
                    "Ø / a"
                ],
                correct: 1,
                explanation: "<strong>Giải thích:</strong> 'Honesty' là danh từ không đếm được chỉ trừu tượng nói chung nên không dùng mạo từ (Ø). 'Best' là tính từ ở cấp so sánh nhất nên bắt buộc phải đi với 'the'."
            },
            {
                question: "My father goes to ______ work by ______ bus every day, but today he took ______ taxi because he was late.",
                options: [
                    "Ø / Ø / a",
                    "the / a / the",
                    "Ø / the / a",
                    "the / Ø / the"
                ],
                correct: 2,
                explanation: "<strong>Giải thích:</strong> Cấu trúc 'go to work' không dùng mạo từ. 'By bus' là phương tiện đi lại chung chung không dùng mạo từ. 'Taxi' là danh từ đếm được số ít, nhắc đến lần đầu và ở dạng tổng quát nên dùng 'a'."
            },
            {
                question: "______ most people in ______ modern society enjoy ______ listening to music.",
                options: [
                    "The / the / Ø",
                    "Ø / Ø / Ø",
                    "The / Ø / the",
                    "Ø / the / the"
                ],
                correct: 1,
                explanation: "<strong>Giải thích:</strong> 'Most' đi trực tiếp với danh từ số nhiều 'people' mang nghĩa 'hầu hết mọi người' thì không dùng mạo từ. 'Modern society' là cụm danh từ chung chung không xác định cụ thể xã hội nào nên dùng Ø. 'Listening to music' cũng không dùng mạo từ trước danh từ không đếm được 'music'."
            },
            {
                question: "She hopes to become ______ university professor in ______ future, specializing in ______ European history.",
                options: [
                    "an / the / Ø",
                    "a / the / Ø",
                    "an / a / the",
                    "a / the / the"
                ],
                correct: 1,
                explanation: "<strong>Giải thích:</strong> 'University' bắt đầu bằng âm phụ âm /j/ (dù viết là u) nên dùng mạo từ 'a'. Cố định cụm từ 'in the future'. 'European history' là tên một lĩnh vực/môn học (kết hợp tính từ riêng) nên không dùng mạo từ."
            },
            {
                question: "______ French are famous for their exquisite cuisine and love for ______ wine.",
                options: [
                    "The / the",
                    "Ø / Ø",
                    "The / Ø",
                    "Ø / the"
                ],
                correct: 2,
                explanation: "<strong>Giải thích:</strong> 'The + tên quốc tịch (như French, English)' dùng để chỉ toàn bộ người dân nước đó ở số nhiều. 'Wine' là danh từ không đếm được nói chung chung nên không dùng mạo từ."
            },
            {
                question: "He was elected ______ chairman of ______ committee last month.",
                options: [
                    "a / the",
                    "the / the",
                    "Ø / the",
                    "the / a"
                ],
                correct: 2,
                explanation: "<strong>Giải thích:</strong> Chức vụ duy nhất đi sau các từ như 'elect, appoint' ở dạng bổ ngữ thì không dùng mạo từ (Ø chairman). 'Committee' là danh từ xác định cụ thể trong ngữ cảnh nên dùng 'the'."
            },
            {
                question: "It was ______ honor to be invited to ______ dinner with ______ Prime Minister.",
                options: [
                    "an / Ø / the",
                    "a / the / the",
                    "an / the / a",
                    "the / Ø / Ø"
                ],
                correct: 0,
                explanation: "<strong>Giải thích:</strong> 'Honor' bắt đầu bằng âm h câm (/ˈɒnər/) nên dùng 'an'. Tên các bữa ăn ('dinner') thông thường không dùng mạo từ. 'Prime Minister' (Thủ tướng) là chức vụ duy nhất trong một quốc gia tại một thời điểm nên dùng 'the'."
            },
            {
                question: "She has ______ headache because she spent all night studying for ______ physics test.",
                options: [
                    "a / the",
                    "Ø / a",
                    "a / Ø",
                    "the / the"
                ],
                correct: 0,
                explanation: "<strong>Giải thích:</strong> Cố định trong tiếng Anh: 'have a headache' (đau đầu). 'Physics test' là bài kiểm tra vật lý được xác định rõ là bài kiểm tra nào thông qua ngữ cảnh học tập cả đêm nên dùng 'the'."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = quizData[currentQuestion];
            document.getElementById('question-counter').innerText = `Câu ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/30 font-medium text-slate-700 transition duration-150";
                btn.innerText = option;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-box').className = 'hidden';
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.getElementsByTagName('button');

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === q.correct) {
                    buttons[i].className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-800 font-medium";
                } else if (i === selectedIndex) {
                    buttons[i].className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-50 text-rose-800 font-medium";
                } else {
                    buttons[i].className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-slate-50 text-slate-400";
                }
            }

            if (selectedIndex === q.correct) {
                score++;
            }

            const expBox = document.getElementById('explanation-box');
            expBox.innerHTML = q.explanation;
            expBox.className = selectedIndex === q.correct 
                ? "mb-6 p-4 rounded-xl text-sm bg-emerald-50 text-emerald-900 border border-emerald-200" 
                : "mb-6 p-4 rounded-xl text-sm bg-rose-50 text-rose-900 border border-rose-200";

            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerText = "Xem kết quả";
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.remove('hidden');
            document.getElementById('final-score').innerText = `Bạn trả lời đúng ${score} / ${quizData.length} câu!`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        // Khởi động câu đầu tiên
        loadQuestion();
    </script>
</body>
</html>
```eof
